*{

    margin:0;
    padding:0;

body{
    font-family:Arial, sans-serif;
    background:#f4f8f3;
    color:#244d2b;
}

header{
    background:linear-gradient(135deg,#315f32,#6f8f3d);
    color:white;
    padding:25px 15px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;

}

.slogan{
    margin-top:7px;

}

nav{
    background:white;
    padding:12px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

nav button{
    border:none;
    background:none;
    color:#315f32;
    font-weight:bold;
    margin:5px 12px;
    cursor:pointer;
    font-size:15px;
}

nav button:hover{
    color:#789447;
}

.container{
    width:94%;
    max-width:1200px;
    margin:30px auto;
}

.titulo{
    text-align:center;
    margin-bottom:25px;
    color:#315f32;
}

.filtros{
    display:flex;

    margin-bottom:25px;
}

.filtros button{

    border-radius:25px;
    background:white;

    cursor:pointer;
    font-weight:bold;
}

.filtros button:hover,

    color:white;
}

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.producto{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    display:flex;
    flex-direction:column;
    transition:.2s;
}

.producto:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(0,0,0,.15);
}

.producto-imagen{

    height:210px;
    background:#f5f8f2;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    margin-bottom:15px;
}

.producto-imagen img{

    height:100%;

}

.sin-imagen{

    font-size:14px;
    text-align:center;
    padding:20px;
}

.producto h3{
    color:#315f32;
    margin-bottom:8px;
    min-height:42px;
}

.categoria{
    font-size:12px;
    color:#789447;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:8px;
}

.descripcion{
    font-size:14px;
    color:#555;
    line-height:1.45;
    min-height:62px;
    margin-bottom:10px;
}

.precio{
    font-size:22px;
    font-weight:bold;
    color:#315f32;
    margin:8px 0 12px;
}

.producto button{
    background:#315f32;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-top:auto;
}

.producto button:hover{
    background:#6f8f3d;
}

#carrito{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    margin-top:40px;
}

.carrito-item{
    border-bottom:1px solid #ddd;
    padding:12px 0;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.cantidad{
    display:flex;
    align-items:center;
    gap:8px;
}

.cantidad button{
    width:30px;
    height:30px;
    border:none;
    border-radius:5px;
    background:#63833d;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.total{
    font-size:23px;
    font-weight:bold;
    text-align:right;
    color:#315f32;
    margin:20px 0;
}

.formulario{
    display:grid;
    gap:12px;
    margin-top:20px;
}

.formulario input,
.formulario textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.formulario textarea{
    min-height:90px;
    resize:vertical;
}

.btn-whatsapp{
    background:#25D366 !important;
    font-size:16px;
}

.vacio{
    text-align:center;
    padding:25px;
    color:#777;
}

footer{

    color:white;
    text-align:center;
    padding:30px 15px;
    margin-top:50px;

}

let carrito = [];

function imagenProducto(producto){

    const archivo = producto.nombre
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");

    return "productos/" + archivo + ".jpg";
}

function mostrarProductos(lista = productos){

    const contenedor = document.getElementById("productos");

    contenedor.innerHTML = "";

    lista.forEach((producto,index)=>{

        const card = document.createElement("div");
        card.className = "producto";

        card.innerHTML = `
            <div class="producto-imagen">
                <img 
                    src="${imagenProducto(producto)}"
                    alt="${producto.nombre}"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'sin-imagen\\'>📷<br>Imagen próximamente</div>'"
                >
            </div>

            <div class="categoria">${producto.categoria}</div>

            <h3>${producto.nombre}</h3>

            <div class="descripcion">
                Información del producto disponible en el catálogo MEDICPRAG.
            </div>

            <div class="precio">
                $${producto.precio.toFixed(2)}
            </div>

            <button onclick="agregarAlCarrito(${index})">
                Comprar
            </button>
        `;

        contenedor.appendChild(card);
    });
}

function filtrar(categoria,boton){

    document.querySelectorAll(".filtros button")
        .forEach(b=>b.classList.remove("activo"));

    boton.classList.add("activo");

    if(categoria === "todos"){
        mostrarProductos(productos);
    }else{
        mostrarProductos(
            productos.filter(p=>p.categoria === categoria)
        );
    }
}

function agregarAlCarrito(index){

    const producto = productos[index];

    const existente = carrito.find(
        item => item.nombre === producto.nombre
    );

    if(existente){
        existente.cantidad++;
    }else{
        carrito.push({
            ...producto,
            cantidad:1
        });
    }

    actualizarCarrito();

    document.getElementById("carrito")
        .scrollIntoView({behavior:"smooth"});
}

function cambiarCantidad(index,cambio){

    carrito[index].cantidad += cambio;

    if(carrito[index].cantidad <= 0){
        carrito.splice(index,1);
    }

    actualizarCarrito();
}

function actualizarCarrito(){

    const lista = document.getElementById("listaCarrito");
    const contador = document.getElementById("contador");
    const totalElemento = document.getElementById("total");

    lista.innerHTML = "";

    if(carrito.length === 0){

        lista.innerHTML = `
            <div class="vacio">
                Tu carrito está vacío.
            </div>
        `;

        contador.textContent = "0";
        totalElemento.textContent = "0.00";

        return;
    }

    let total = 0;
    let cantidadTotal = 0;

    carrito.forEach((item,index)=>{

        const subtotal = item.precio * item.cantidad;

        total += subtotal;
        cantidadTotal += item.cantidad;

        lista.innerHTML += `
            <div class="carrito-item">

                <div>
                    <strong>${item.nombre}</strong>
                    <br>
                    $${item.precio.toFixed(2)}
                    <br>
                    Subtotal: $${subtotal.toFixed(2)}
                </div>

                <div class="cantidad">

                    <button onclick="cambiarCantidad(${index},-1)">
                        −
                    </button>

                    <strong>${item.cantidad}</strong>

                    <button onclick="cambiarCantidad(${index},1)">
                        +
                    </button>

                </div>

            </div>
        `;
    });

    contador.textContent = cantidadTotal;
    totalElemento.textContent = total.toFixed(2);
}

function enviarWhatsApp(){

    if(carrito.length === 0){

        alert("Tu carrito está vacío.");

        return;
    }

    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const direccion = document.getElementById("direccion").value.trim();

    if(!nombre || !telefono || !direccion){

        alert("Por favor completa nombre, teléfono y dirección.");

        return;
    }

    let mensaje = "Hola MEDICPRAG, quiero realizar el siguiente pedido:%0A%0A";

    let total = 0;

    carrito.forEach(item=>{

        const subtotal = item.precio * item.cantidad;

        total += subtotal;

        mensaje +=
        "Producto: " + item.nombre +
        "%0ACantidad: " + item.cantidad +
        "%0APrecio: $" + item.precio.toFixed(2) +
        "%0ASubtotal: $" + subtotal.toFixed(2) +
        "%0A%0A";
    });

    mensaje +=
        "TOTAL: $" + total.toFixed(2) +
        "%0A%0A" +
        "DATOS DEL CLIENTE" +
        "%0ANombre: " + encodeURIComponent(nombre) +
        "%0ATeléfono: " + encodeURIComponent(telefono) +
        "%0ADirección: " + encodeURIComponent(direccion);

    const numeroWhatsApp = "593997046252";

    const url =
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        mensaje;

    window.open(url,"_blank");
}

function irA(id){

    document.getElementById(id)
        .scrollIntoView({behavior:"smooth"});
}

actualizarCarrito();
