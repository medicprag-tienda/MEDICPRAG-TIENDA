<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;

body{
  font-family:Arial, sans-serif;
  background:#f5f8f2;
  color:#24452b;
}

header{
  background:linear-gradient(135deg,#315c32,#6f8f3d);
  color:white;
  text-align:center;
  padding:25px 15px;
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:8px;
  margin-bottom:10px;
}

header h1{
  font-size:34px;
  margin-bottom:5px;
}

header p{
  font-size:15px;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 8px #0002;
}

nav button{
  border:none;
  background:#315c32;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

nav button:hover{
  background:#6f8f3d;
}

.container{
  width:95%;
  max-width:1200px;
  margin:25px auto;
}

.hero{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 3px 12px #0001;
}

.hero h2{
  color:#315c32;
  margin-bottom:10px;
}

.search{
  width:100%;
  padding:14px;
  border:2px solid #c8d8bd;
  border-radius:10px;
  margin:20px 0;
  font-size:16px;
}

.category-title{
  margin:30px 0 15px;
  color:#315c32;
  border-left:6px solid #6f8f3d;
  padding-left:10px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
  display:flex;
  flex-direction:column;
}

.product-image{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#f7faf5;
  padding:15px;
}

.product-content{
  padding:16px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product h3{
  color:#315c32;
  margin-bottom:8px;
  font-size:18px;
}

.description{
  font-size:14px;
  line-height:1.5;
  color:#555;
  margin-bottom:12px;
  flex:1;
}

.price{
  font-size:22px;
  font-weight:bold;
  color:#315c32;
  margin-bottom:12px;
}

.buy{
  border:none;
  background:#315c32;
  color:white;
  padding:12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.buy:hover{
  background:#6f8f3d;
}

#cart{
  margin-top:40px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 12px #0002;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.cart-controls button{
  width:30px;
  height:30px;
  border:none;
  border-radius:5px;
  background:#315c32;
  color:white;
  cursor:pointer;
}

.total{
  font-size:24px;
  font-weight:bold;
  margin:20px 0;
  color:#315c32;
}

.form input,
.form textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #c8d8bd;
  border-radius:8px;
  font-size:15px;
}

.form textarea{
  min-height:90px;
  resize:vertical;
}

.whatsapp{
  width:100%;
  border:none;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

footer{
  margin-top:40px;
  background:#315c32;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  header h1{
    font-size:28px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .cart-item{
    flex-direction:column;
    align-items:flex-start;

}
</style>
</head>

/* =========================
   IMAGEN
========================= */

function nombreImagen(nombre){

  return "productos/" +
    nombre
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-|-$/g,"")
    + ".jpg";

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(){

  const contenedor = document.getElementById("products");

  const busqueda =
    document.getElementById("search").value
    .toLowerCase();

  const filtrados = productos.filter(p =>
    p.nombre.toLowerCase().includes(busqueda)
  );

  contenedor.innerHTML = "";

  if(filtrados.length === 0){

    contenedor.innerHTML =
      '<div class="empty">No encontramos ese producto.</div>';

    return;
  }

  filtrados.forEach((producto,index)=>{

    const originalIndex =
      productos.indexOf(producto);

    const card = document.createElement("div");

    card.className = "product";

    card.innerHTML = `

      <img
        class="product-image"
        src="${nombreImagen(producto.nombre)}"
        alt="${producto.nombre}"
        onerror="this.src='logo.png'"
      >

      <div class="product-content">

        <h3>${producto.nombre}</h3>

        <p class="description">
          ${descripciones[producto.nombre]}
        </p>

        <div class="price">
          $${producto.precio.toFixed(2)}
        </div>

        <button
          class="buy"
          onclick="agregarAlCarrito(${originalIndex})"
        >
          🛒 Comprar
        </button>

      </div>
    `;

    contenedor.appendChild(card);

  });

}


/* =========================
   CARRITO
========================= */

function agregarAlCarrito(index){

  const producto = productos[index];

  const existente =
    carrito.find(item => item.nombre === producto.nombre);

  if(existente){

    existente.cantidad++;

  }else{

    carrito.push({
      nombre:producto.nombre,
      precio:producto.precio,
      cantidad:1
    });

  }

  mostrarCarrito();

  document.getElementById("cart")
    .scrollIntoView({behavior:"smooth"});

}


function cambiarCantidad(index,cambio){

  carrito[index].cantidad += cambio;

  if(carrito[index].cantidad <= 0){

    carrito.splice(index,1);

  }

  mostrarCarrito();

}


function mostrarCarrito(){

  const contenedor =
    document.getElementById("cartItems");

  const count =
    document.getElementById("cartCount");

  const totalElement =
    document.getElementById("cartTotal");

  contenedor.innerHTML = "";

  let total = 0;
  let cantidadTotal = 0;

  if(carrito.length === 0){

    contenedor.innerHTML =
      '<div class="empty">Tu carrito está vacío.</div>';

  }

  carrito.forEach((item,index)=>{

    const subtotal =
      item.precio * item.cantidad;

    total += subtotal;

    cantidadTotal += item.cantidad;

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div>
        <strong>${item.nombre}</strong>
        <br>
        $${item.precio.toFixed(2)} cada uno
      </div>

      <div class="cart-controls">

        <button
          onclick="cambiarCantidad(${index},-1)"
        >−</button>

        <strong>${item.cantidad}</strong>

        <button
          onclick="cambiarCantidad(${index},1)"
        >+</button>

      </div>

      <strong>
        $${subtotal.toFixed(2)}
      </strong>
    `;

    contenedor.appendChild(div);

  });

  count.textContent = cantidadTotal;

  totalElement.textContent =
    total.toFixed(2);

}


/* =========================
   WHATSAPP
========================= */

function enviarWhatsApp(){

  if(carrito.length === 0){

    alert("Primero agrega productos al carrito.");

    return;
  }

  const nombre =
    document.getElementById("customerName").value.trim();

  const telefono =
    document.getElementById("customerPhone").value.trim();

  const direccion =
    document.getElementById("customerAddress").value.trim();


  if(!nombre || !telefono || !direccion){

    alert(
      "Por favor completa tu nombre, teléfono y dirección de entrega."
    );

    return;
  }


  let mensaje =
    "Hola MEDICPRAG, quiero realizar el siguiente pedido:%0A%0A";

  let total = 0;

  carrito.forEach(item => {

    const subtotal =
      item.precio * item.cantidad;

    total += subtotal;

    mensaje +=
      "• " + item.nombre +
      " x" + item.cantidad +
      " = $" + subtotal.toFixed(2) +
      "%0A";

  });


  mensaje +=
    "%0A*TOTAL: $" +
    total.toFixed(2) +
    "*%0A%0A";

  mensaje +=
    "*Datos del cliente*%0A";

  mensaje +=
    "Nombre: " +
    encodeURIComponent(nombre) +
    "%0A";

  mensaje +=
    "Teléfono: " +
    encodeURIComponent(telefono) +
    "%0A";

  mensaje +=
    "Dirección: " +
    encodeURIComponent(direccion);


  const url =
    "https://wa.me/" +
    WHATSAPP +
    "?text=" +
    mensaje;

  window.open(url,"_blank");

}
